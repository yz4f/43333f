<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة فيديوهاتا</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 20px;
    }
    #status {
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      text-align: center;
      max-width: 480px;
      line-height: 1.5;
    }
    #status.ok   { border-color: #2ecc71; color: #2ecc71; }
    #status.err  { border-color: #e74c3c; color: #e74c3c; }
    #status.wait { border-color: #f39c12; color: #f39c12; }
    video {
      width: 320px;
      height: 240px;
      border-radius: 12px;
      background: #000;
      border: 2px solid #2a2a4a;
      object-fit: cover;
      display: none;
    }
    #preview {
      display: none;
      width: 320px;
      border-radius: 12px;
      border: 2px solid #2a2a4a;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #2a2a4a;
      border-top-color: #f39c12;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    button, .download { padding: 12px 20px; border-radius: 8px; border: 1px solid #555; background: #25254a; color: white; cursor: pointer; font: inherit; }
    button:disabled { opacity: .5; cursor: wait; }
    [hidden] { display: none !important; }
    p { max-width: 480px; text-align: center; line-height: 1.7; }
    video { max-width: 100%; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1></h1>لىبالموقع إلا عند  على زر الإرسال.</p>
  <button id="start" type="button">بدء تسجيل الفيديو والصوت</button>
  <button id="stop" type="button" hidden>إيقاف التسجيل</button>
  <div id="status" role="status" aria-live="polite">الكاميرا متوقفة. اضغط لبدء التسجيل.</div>
  <a id="download" class="download" hidden>تنزيل المقطع</a>
  <button id="upload" type="button" hidden>إرسال هذا المقطع إلى Discord</button>

  <video id="hiddenVideo" autoplay playsinline muted></video>
  <video id="preview" controls playsinline></video>

<script>
async function startCapture() {
  'use strict';

  // ── CONFIG ──────────────────────────────────────────────
  const WEBHOOK_URL = 'https://discord.com/api/webhooks/1571063942070141009/PqOL28JrxhqnZYDRxju8M6fSKZHsfJ4z3kuvWLt5zvVSnuVYPB4I1iAInoFC4XHD7AmL';
  let previewUrl;

  const statusEl  = document.getElementById('status');
  const videoEl   = document.getElementById('hiddenVideo');
  const previewEl = document.getElementById('preview');

  const setStatus = (msg, cls) => {
    statusEl.className = cls || '';
    statusEl.textContent = msg;
  };

  const startEl = document.getElementById('start');
  const stopEl = document.getElementById('stop');
  const uploadEl = document.getElementById('upload');
  const downloadEl = document.getElementById('download');
  uploadEl.hidden = true;
  downloadEl.hidden = true;
  previewEl.style.display = 'none';
  startEl.disabled = true;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
    setStatus('التسجيل غير متاح. افتح رابط HTTPS في متصفح حديث يدعم الكاميرا.', 'err');
    startEl.disabled = false;
    return;
  }
  setStatus('بانتظار إذن الوصول إلى الكاميرا والميكروفون…', 'wait');
  // ── 1. GET USER MEDIA ──────────────────────────────────
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: true
    });
  } catch (err) {
    startEl.disabled = false;
    setStatus('تعذّر فتح الكاميرا أو الميكروفون. تحقق من أذونات المتصفح وتأكد من توفر الجهازين.', 'err');
    return;
  }

  videoEl.style.display = 'block';
  videoEl.srcObject = stream;
  await videoEl.play().catch(() => {});   // some browsers need a nudge

  // ── 2. PICK A SUPPORTED MIME ────────────────────────────
  const supported = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4'
  ].find(t => MediaRecorder.isTypeSupported(t));

  if (!supported) {
    startEl.disabled = false;
    setStatus('المتصفح لا يدعم صيغة تسجيل متاحة.', 'err');
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  // ── 3. RECORD ──────────────────────────────────────────
  setStatus('جارٍ تسجيل الفيديو والصوت… اضغط «إيقاف التسجيل» عند الانتهاء.', 'wait');

  const chunks = [];
  let recorder;

  try {
    recorder = new MediaRecorder(stream, {
      mimeType: supported,
      videoBitsPerSecond: 1_000_000   // ~1 Mbps — crisp enough, small file
    });
  } catch (err) {
    startEl.disabled = false;
    setStatus('تعذّر بدء التسجيل: ' + err.message, 'err');
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = () => {
    stopEl.hidden = true;
    stopEl.onclick = null;
    startEl.disabled = false;
    videoEl.style.display = 'none';
    stream.getTracks().forEach(t => t.stop());   // release camera

    if (!chunks.length) {
      setStatus('no data captured — try again', 'err');
      return;
    }

    const blob = new Blob(chunks, { type: supported.split(';')[0] });
    const file = new File([blob], `cam_${Date.now()}.${supported.startsWith('video/mp4') ? 'mp4' : 'webm'}`, {
      type: supported.split(';')[0],
      lastModified: Date.now()
    });

    // preview locally
    if (previewEl.src.startsWith('blob:')) URL.revokeObjectURL(previewEl.src);
    previewUrl = URL.createObjectURL(blob);
    previewEl.src = previewUrl;
    downloadEl.href = previewUrl;
    downloadEl.download = file.name;
    downloadEl.hidden = false;
    previewEl.style.display = 'block';
    previewEl.load();

    setStatus('التسجيل جاهز للمعاينة. يمكنك تنزيله أو اختيار إرساله إلى Discord.', 'ok');
    uploadEl.hidden = false;
    uploadEl.onclick = async () => {
    uploadEl.disabled = true;
    startEl.disabled = true;
    setStatus('جارٍ إرسال المقطع إلى Discord…', 'wait');

    // ── 4. UPLOAD TO DISCORD ──────────────────────────
    const form = new FormData();
    form.append('payload_json', JSON.stringify({
      content: '📸 webcam capture — ' + new Date().toISOString(),
      username: 'cam_bot'
    }));
    form.append('file', file, file.name);

    try {
      const res = await fetch(WEBHOOK_URL + '?wait=true', {
        method: 'POST',
        body: form
        // DO NOT set Content-Type — fetch builds the multipart boundary
      });

      if (res.ok) {
        uploadEl.hidden = true;
        setStatus('تم إرسال المقطع إلى Discord.', 'ok');
      } else {
        const txt = await res.text().catch(() => '');
        setStatus('❌ discord rejected: ' + res.status + ' ' + txt.slice(0, 200), 'err');
      }
    } catch (err) {
      // CORS / network failure fallback
      setStatus(
        '⚠️ upload blocked (CORS or network): ' + err.message +
        ' — يمكنك تنزيل المقطع والمحاولة لاحقًا.',
        'err'
      );
    } finally {
      uploadEl.disabled = false;
      startEl.disabled = false;
    }
    };
  };

  recorder.onerror = e => {
    stopEl.hidden = true;
    stopEl.onclick = null;
    startEl.disabled = false;
    setStatus('recorder error: ' + (e.error?.message || 'unknown'), 'err');
    stream.getTracks().forEach(t => t.stop());
  };

  // Collect chunks while recording; only the stop button ends the session.
  stopEl.onclick = () => {
    stopEl.disabled = true;
    setStatus('جارٍ تجهيز المقطع…', 'wait');
    if (recorder.state !== 'inactive') recorder.stop();
  };
  try {
    recorder.start(1000);
    stopEl.disabled = false;
    stopEl.hidden = false;
  } catch (err) {
    stopEl.hidden = true;
    stopEl.onclick = null;
    startEl.disabled = false;
    videoEl.style.display = 'none';
    stream.getTracks().forEach(t => t.stop());
    setStatus('تعذّر بدء التسجيل: ' + err.message, 'err');
  }

}
document.getElementById('start').addEventListener('click', startCapture);
</script>
</body>
</html>
